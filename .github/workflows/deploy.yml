name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - 'chore/#24/cicd'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kbeauty_test
          MYSQL_USER: kbeauty
          MYSQL_PASSWORD: kbeauty_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:mysql://localhost:3306/kbeauty_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: kbeauty
          DB_PASSWORD: kbeauty_test_password
          NAVER_CLIENT_ID: test
          NAVER_CLIENT_SECRET: test
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Deploy application
        run: |
          set -e

          cd /home/ubuntu/K-Beauty-BE

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          sleep 15
          curl -f http://localhost:8080/health
