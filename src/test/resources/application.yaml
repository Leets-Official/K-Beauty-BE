spring:
  application:
    name: k-beauty

  # datasource는 MySqlTestContainerConfig의 @ServiceConnection이 주입한다.
  # .env import와 ${DB_URL} 참조를 두지 않으므로 테스트는 환경변수에 의존하지 않는다.
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# 이 파일이 src/main의 application.yaml을 가려서 그쪽 cors 설정이 읽히지 않는다.
# 그래서 여기에도 따로 두어야 SecurityConfig가 프로퍼티를 찾을 수 있다.
cors:
  allowed-origins: http://localhost:5173

product:
  price-update:
    schedule-enabled: false
