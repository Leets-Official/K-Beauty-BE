spring:
  config:
    import: optional:file:.env.prod[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# 운영 허용 오리진. docker compose가 .env.prod의 값을 컨테이너 환경변수로 넣어준다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cosmetch.kr,https://www.cosmetch.kr,https://*.cosmetch.kr}
