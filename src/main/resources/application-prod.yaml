spring:
  config:
    import: optional:file:.env.prod[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# 운영 허용 오리진. docker compose가 .env.prod의 값을 컨테이너 환경변수로 넣어준다.
#
# 뒤에 붙인 로컬 주소들은 임시고 아직 도메인을 사지 않아 프론트를 배포할 수 없어서,
# 로컬에서 띄운 프론트가 이 서버를 직접 부르는 것 말고는 연동을 확인할 방법이 없음
#
# 폴백값 안이 아니라 ${} 바깥에 이어 붙인 이유가 있다. 서버의 .env.prod에
# CORS_ALLOWED_ORIGINS가 이미 들어 있으면 폴백값은 아예 쓰이지 않는다.
# 바깥에 두면 환경변수가 있든 없든 로컬 주소가 목록에서 빠지지 않는다.
#
# 목록은 application.yaml의 로컬 주소와 똑같이 맞춰 둔다. 둘이 다르면
# 로컬에서는 되는데 배포에서만 막히는 상황이 또 생긴다.
#
# 도메인을 사고 프론트를 배포하면 이 세 개를 지운다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cosmetch.kr,https://www.cosmetch.kr,https://*.cosmetch.kr},http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
