spring:
  application:
    name: k-beauty

# DB는 일단 H2로 해뒀고 나중에 변경하면 될 것 같습니다.
  datasource:
    url: jdbc:h2:mem:kbeauty;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true